[project]
name = "sparklogagent"
version = "0.1.0"
description = "Spark troubleshooting agent assets, YARN log utility, and log MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
spark-logs-utility = "log_utility.server:main"
spark-logs-mcp = "spark_logs.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["log_utility", "spark_logs"]

[tool.setuptools.package-dir]
log_utility = "log_utility"
spark_logs = "mcp/spark_logs"

[tool.pytest.ini_options]
pythonpath = [".", "mcp"]
